<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Generator</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <h1>Alphabet Generator</h1>
    <button id="btn-tirer">Tirer un signe</button>

    <div id="resultat">
        <p>Prêt pour le tirage ?</p>
    </div>

    <script>
        const btn = document.getElementById('btn-tirer');
        const content = document.getElementById('resultat');

        btn.addEventListener('click', async () => {
            content.innerHTML = "<p>Chargement...</p>";
            
            try {
                // Utilisation d'un paramètre aléatoire pour éviter le cache navigateur
                const response = await fetch('/fa/random?nocache=' + Date.now());
                const data = await response.json();

                // On vérifie que la prescription existe, sinon on met un message par défaut
                const prescriptionAffichage = data.prescription ? data.prescription : "Aucune prescription trouvée.";

                content.innerHTML = `
                    <h2>${data.signe}</h2>
                    <p>${data.description}</p>
                    <div class="prescription-text">
                        <strong>Conseil du Fa :</strong><br>
                        ${prescriptionAffichage}
                    </div>
                `;
            } catch (err) {
                console.error("Erreur Fetch:", err);
                content.innerHTML = "<p style='color:red'>Erreur de connexion au serveur</p>";
            }
        });
    </script>
</body>
</html>
